services:
  # ----------------------------
  # Broker Kafka
  # ----------------------------
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "9096:9096"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://kafka:9096,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9096,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9096"
      CLUSTER_ID: "4L62IdtzT-makk48j9YgAg"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      # --- Tuning ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_REQUEST_TIMEOUT_MS: 60000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9096"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sdcc_progetto

  # ----------------------------
  # Setup Kafka (Creazione Topic)
  # ----------------------------
  init-kafka:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-kafka.sh"]
    volumes:
      - ./kafka/init-kafka.sh:/init-kafka.sh:ro
    networks:
      - sdcc_progetto

  # ----------------------------
  # Generatore di Eventi (Go)
  # ----------------------------
  events-generator:
    build:
      context: .
      dockerfile: ./events-generator/Dockerfile
    container_name: events_generator
    restart: unless-stopped
    ports:
      - "8081:8081" # Espone la Dashboard HTTP
    environment:
      - KAFKA_BROKER=kafka:9096 # Usa la porta interna di Kafka
    depends_on:
      init-kafka:
        condition: service_completed_successfully # Attende la creazione dei Topic
    networks:
      - sdcc_progetto

  # ----------------------------
  # Servizio --> Ingestion-Service (Go)
  # ----------------------------
  ingestion-service:
    build:
      context: ./services/ingestion-service
      dockerfile: Dockerfile
    container_name: ingestion_service
    restart: unless-stopped
    environment:
      - KAFKA_BROKER=kafka:9096 # Usa la porta interna di Kafka
    depends_on:
      init-kafka:
        condition: service_completed_successfully # Attende la creazione dei Topic
      events-generator:
        condition: service_started # Attende solo l'avvio e non la terminazione
    networks:
      - sdcc_progetto

  # ----------------------------
  # Database Time-Series (InfluxDB v2)
  # ----------------------------
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=sdcc_org
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sdcc_progetto

  # ----------------------------
  # Write Service (Go)
  # ----------------------------
  write-service:
    build:
      context: ./services/write-service
      dockerfile: Dockerfile
    container_name: write_service
    restart: unless-stopped
    environment:
      - KAFKA_BROKER=kafka:9096
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-token
      - INFLUXDB_ORGANIZATION=sdcc_org
      - INFLUXDB_BUCKET=telemetry
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    networks:
      - sdcc_progetto

  # ----------------------------
  # Analyzer Service (Go)
  # ----------------------------
  analyzer-service:
    build:
      context: ./services/analyzer-service
      dockerfile: Dockerfile
    container_name: analyzer_service
    restart: unless-stopped
    environment:
      - KAFKA_BROKER=kafka:9096
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - sdcc_progetto

networks:
  sdcc_progetto:
    driver: bridge