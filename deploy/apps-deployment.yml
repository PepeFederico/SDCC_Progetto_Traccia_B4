---
# ==========================================
# SINK-SERVICE (Worker 3 - Data)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink-service
  namespace: sdcc-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sink-service
  template:
    metadata:
      labels:
        app: sink-service
    spec:
      nodeSelector:
        node-role.kubernetes.io/role: data
      containers:
        - name: sink-service
          image: one00fp/sink-service:v1.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: INFLUXDB_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: INFLUXDB_BUCKET_MEASUREMENT
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INFLUXDB_TOKEN
          ports:
            - containerPort: 50052
            - containerPort: 2112