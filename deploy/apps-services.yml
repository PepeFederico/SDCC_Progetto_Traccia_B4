# Service gRPC per Events-Generator
apiVersion: v1
kind: Service
metadata:
  name: events-generator-service
  namespace: sdcc-namespace
spec:
  selector:
    app: events-generator
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051

---
# Service gRPC per Sink-Service
apiVersion: v1
kind: Service
metadata:
  name: sink-service
  namespace: sdcc-namespace
spec:
  selector:
    app: sink-service
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: metrics
      port: 2112
      targetPort: 2112

---
# Service Metriche per Decision-Service
apiVersion: v1
kind: Service
metadata:
  name: decision-service
  namespace: sdcc-namespace
spec:
  selector:
    app: decision-service
  ports:
    - name: metrics
      port: 2112
      targetPort: 2112

---
# Service NodePort per il Front-End (Accessibile da IP Pubblico EC2)
apiVersion: v1
kind: Service
metadata:
  name: front-end-service
  namespace: sdcc-namespace
spec:
  type: NodePort
  selector:
    app: front-end
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
# Service per Redis (Worker Core)
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: sdcc-namespace
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379