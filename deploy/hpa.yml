apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-service-hpa
  namespace: sdcc-namespace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-service
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: External
      external:
        metric:
          name: kafka_consumergroup_lag_by_group
          selector:
            matchLabels:
              consumergroup: "temperature-group"
        target:
          type: AverageValue
          averageValue: "1000"         # Scala quando il lag medio per worker supera i 1.000 eventi
    - type: External
      external:
        metric:
          name: kafka_consumergroup_lag_by_group
          selector:
            matchLabels:
              consumergroup: "pressure-group"
        target:
          type: AverageValue
          averageValue: "1000"         # Scala quando il lag medio per worker supera i 1.000 eventi
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180  # Finestra di 3m per prevenire il flapping
      policies:
        - type: Percent
          value: 25                    # Riduzione graduale (-25% delle repliche)
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max                # Sceglie la policy che crea più pod per massima reattività
      policies:
        - type: Percent
          value: 100                   # Permette il raddoppio delle repliche
          periodSeconds: 15

