apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: sdcc-namespace
type: Opaque
stringData:
  GRAFANA_ADMIN_PASSWORD: "admin"   # cambiala se vuoi qualcosa di più sicuro
---
# ==========================================
# CONFIGMAP: PROMETHEUS CONFIG
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sdcc-namespace
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'decision-service'
        static_configs:
          - targets: ['decision-service:2112']

      - job_name: 'sink-service'
        static_configs:
          - targets: ['sink-service:2112']

      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['kafka-exporter-service:9308']

      - job_name: 'kubelet-cadvisor'
        scheme: https
        kubernetes_sd_configs:
          - role: node
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

---
# ==========================================
# PROMETHEUS
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sdcc-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      nodeSelector:
        node-role.kubernetes.io/role: data
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: sdcc-namespace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: sdcc-namespace
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090  # UI Prometheus accessibile da IP_EC2:30090

---
# ==========================================
# GRAFANA
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sdcc-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        node-role.kubernetes.io/role: data
      # Grafana scrive come utente 472 di default: il volume deve permettergli
      # di lavorare anche se il PVC viene montato come root inizialmente
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.0.1
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GRAFANA_ADMIN_PASSWORD
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: sdcc-namespace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: sdcc-namespace
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300  # Dashboard Grafana accessibile da IP_EC2:30300

---
# ==========================================
# KAFKA EXPORTER
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: sdcc-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      nodeSelector:
        node-role.kubernetes.io/role: core
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.7.0
          args:
            - "--kafka.server=kafka-service:9092"
          ports:
            - containerPort: 9308
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter-service
  namespace: sdcc-namespace
spec:
  selector:
    app: kafka-exporter
  ports:
    - port: 9308
      targetPort: 9308