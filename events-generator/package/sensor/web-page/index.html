<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Controllo Sensori - Simulator Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Panello di Controllo Sensori</h1>

<div class="card">
    <label for="sensorSelect">Seleziona Sensore:</label>
    <select id="sensorSelect">
        <option value="">Caricamento sensori...</option>
    </select>

    <label for="magnitudeInput">Magnitude (per Spike o Drift Rate):</label>
    <input type="number" id="magnitudeInput" step="0.1" value="3.0">

    <div class="btn-group">
        <button class="btn-normal" onclick="sendCommand('ModeNormal')">Set Normal</button>
        <button class="btn-spike" onclick="sendCommand('ModeSpike')">Inietta Spike</button>
        <button class="btn-drift" onclick="sendCommand('ModeDrift')">Attiva Drift</button>
        <button class="btn-stop" onclick="sendCommand('ModeStop')">Arresta (Stop)</button>
    </div>
</div>

<div id="log">Stato: In attesa di comandi...</div>

<h1>Inserimento nuovo Sensore</h1>

<div class="form">
    <form id="InsertNewSensor">
        <fieldset>
            <ol>
                <li>
                    <label for="sensorId">Identificativo Sensore</label>

                    <input id="sensorId" name="sensorId" type="text" placeholder="Inserisci Id del Sensore" required>
                </li>
                <li>
                    <label for="newSensorSelect">Tipo di Sensore:</label>
                    <select id="newSensorSelect" required>
                        <option value="">Caricamento tipi...</option>
                    </select>
                </li>
                <li>
                    <label for="machineToControl">Macchina da controllare</label>
                    <input id="machineToControl" name="machineToControl" type="text" placeholder="Inserisci nome macchina" required>
                </li>
                <li>
                    <label for="mean">Media Operativa</label>
                    <input id="mean" name="mean" type="number" step="0.1" placeholder="Inserisci valore medio" required>
                </li>
                <li>
                    <label for="variance">Varianza</label>
                    <input id="variance" name="variance" type="number" step="0.01" placeholder="Inserisci varianza" required>
                </li>
                <li>
                    <label for="rate">Rate di campionamento (in secondi)</label>
                    <input id="rate" name="rate" type="number" step="1" value="1" placeholder="Frequenza in secondi" required>
                </li>
                <li>
                    <label for="soglia-minima">Soglia Minima (Dipendente dal tipo di Sensore)</label>
                    <input id="soglia-minima" name="soglia-minima" type="number" step="1" value="1" placeholder="Definizione soglia minima" required>
                </li>
                <li>
                    <label for="soglia-massima">Soglia Massima (Dipendente dal tipo di Sensore)</label>
                    <input id="soglia-massima" name="soglia-massima" type="number" step="1" value="1" placeholder="Definizione soglia massima" required>
                </li>
                <li>
                    <label for="std-dev">Soglia Instabilità (Definizione std-dev)</label>
                    <input id="std-dev" name="std-dev" type="number" step="1" value="1" placeholder="Definizione deviazione standard" required>
                </li>
                <li>
                    <label for="trend">Soglia di Deriva (Trend ammesso)</label>
                    <input id="trend" name="trend" type="number" step="0.001" value="0.00" placeholder="Definizione soglia trend" required>
                </li>
            </ol>

            <div class="btn-group-insert">
                <button type="submit" class="btn-insert">Invio</button>
                <button type="reset" class="btn-reset" onclick="resetInsertLog()">Cancella</button>
            </div>
        </fieldset>
    </form>
</div>

<div id="logInsert">Stato: In attesa di inserimento nuovo sensore...</div>

<script src="script.js"></script>
</body>
</html>
