<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Controllo Sensori - Simulator Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        select, input, button { padding: 8px; margin-top: 5px; width: 100%; max-width: 300px; display: block; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; color: white; width: auto; padding: 10px 15px; }
        .btn-normal { background-color: #28a745; }
        .btn-spike { background-color: #ffc107; color: black; }
        .btn-drift { background-color: #fd7e14; }
        .btn-stop { background-color: #dc3545; }
        #log { margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>

<h1>Panello di Controllo Sensori</h1>

<div class="card">
    <label for="sensorSelect">Seleziona Sensore:</label>
    <select id="sensorSelect">
        <option value="">Caricamento sensori...</option>
    </select>

    <label for="magnitudeInput">Magnitude (per Spike o Drift Rate):</label>
    <input type="number" id="magnitudeInput" step="0.1" value="3.0">

    <div class="btn-group">
        <button class="btn-normal" onclick="sendCommand('ModeNormal')">Set Normal</button>
        <button class="btn-spike" onclick="sendCommand('ModeSpike')">Inietta Spike</button>
        <button class="btn-drift" onclick="sendCommand('ModeDrift')">Attiva Drift</button>
        <button class="btn-stop" onclick="sendCommand('ModeStop')">Arresta (Stop)</button>
    </div>
</div>

<div id="log">Stato: In attesa di comandi...</div>

<script>
    async function loadSensors() {
        try {
            const res = await fetch('/api/sensors');
            const sensors = await res.json();
            const select = document.getElementById('sensorSelect');
            select.innerHTML = '';
            sensors.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                select.appendChild(opt);
            });
        } catch (err) {
            document.getElementById('log').textContent = "Errore caricamento sensori";
        }
    }

    async function sendCommand(mode) {
        const select = document.getElementById('sensorSelect');
        const sensorID = select.value;

        // Legge il valore numerico direttamente dall'input
        const rawVal = document.getElementById('magnitudeInput').value;
        const val = parseFloat(rawVal) || 0;

        if (!sensorID) {
            alert("Seleziona prima un sensore valido!");
            return;
        }

        // Invia sia camelCase che snake_case per garantire la massima compatibilità
        const payload = {
            sensorId: sensorID,
            sensor_id: sensorID,
            mode: mode,
            spikeMagnitude: mode === 'ModeSpike' ? val : 0,
            spike_magnitude: mode === 'ModeSpike' ? val : 0,
            driftRate: mode === 'ModeDrift' ? val : 0,
            drift_rate: mode === 'ModeDrift' ? val : 0
        };

        try {
            const res = await fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const text = await res.text();
            document.getElementById('log').textContent = `[${new Date().toLocaleTimeString()}] ${text} -> Mode: ${mode} (Val: ${val})`;

            if (mode === 'ModeStop' && res.ok) {
                setTimeout(loadSensors, 1000);
            }
        } catch (err) {
            document.getElementById('log').textContent = `[${new Date().toLocaleTimeString()}] Errore di connessione al server`;
        }
    }

    // Carica la lista dei sensori all'avvio
    loadSensors();
</script>
</body>
</html>
